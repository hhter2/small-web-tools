name: Language integration remediation runner

on:
  push:
    branches:
      - agent/fix-language-switcher-integration
    paths:
      - '.github/workflows/language-integration-remediation-runner.yml'
      - 'scripts/apply-language-integration-remediation.py'
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/language-integration-remediation-runner.yml'
      - 'scripts/apply-language-integration-remediation.py'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Use repository npm version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${NPM_VERSION}"

      - name: Apply integration repair
        run: python scripts/apply-language-integration-remediation.py

      - name: Install dependencies
        run: npm ci

      - name: Validate focused repair
        run: |
          npm run typecheck
          npx vitest run src/tests/languageSwitcher.test.jsx
          npm run build

      - name: Commit repair
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/main.jsx src/components src/tests/languageSwitcher.test.jsx e2e/language-switcher.spec.js docs/architecture ARCHITECTURE.md ARCHITECTURE.zh-TW.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix: render shared language controls in app shell'
          git push origin HEAD:${TARGET_BRANCH}
