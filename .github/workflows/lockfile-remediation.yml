name: Lockfile remediation

on:
  push:
    branches:
      - agent/fix-language-switcher-focus
    paths:
      - '.github/workflows/lockfile-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Use repository npm version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${NPM_VERSION}"

      - name: Generate secure lockfile
        run: |
          npm pkg set overrides.brace-expansion=5.0.9
          npm pkg set overrides.undici=7.29.0
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate

      - name: Commit remediated manifests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remediate audited development dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}
