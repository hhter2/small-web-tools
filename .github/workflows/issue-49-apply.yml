name: Issue 49 apply

on:
  push:
    branches:
      - agent/extract-shared-domain-modules

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-shared-domain-modules
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/apply-issue-49.py
      - run: |
          npm install --global npm@10.9.2
          npm ci
          npm run verify
          npm run platform:integration
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/ipLookupProviders.js src/lib/codeHighlighting.js vite.config.js functions/api/iplookup.js src/components/CodePreviewer/lib/codePreviewDomain.js src/components/CodePreviewer.jsx src/components/MarkdownPreviewer.jsx src/tests/ipLookup.test.js src/tests/ipLookupProviders.test.js src/tests/codePreviewDomain.test.js ARCHITECTURE.md ARCHITECTURE.zh-TW.md
          git commit -m "refactor: extract shared IP lookup and highlighting domains"
          git push
