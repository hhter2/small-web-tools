name: CI

on:
  push:
    branches:
      - main
      - develop
      - refactor-code-review-tasks
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Use repository npm version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Pages/Worker Rate Limit Integration
        if: matrix.node-version == '22'
        run: npm run platform:integration

      - name: Dependency Check
        run: npm run deps:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.node-version }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Security Audit
        run: npm run audit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '22'
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
