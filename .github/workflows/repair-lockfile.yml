name: Repair lockfile

on:
  push:
    branches:
      - agent/node-lts-ci-policy

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/node-lts-ci-policy

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Use repository npm version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Regenerate lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lock"
          git push origin HEAD:agent/node-lts-ci-policy
