name: Issue 57 lockfile generation

on:
  push:
    branches:
      - feature/issue-57-mermaid-converter
    paths:
      - package.json
      - .github/workflows/issue-57-lockfile.yml

permissions:
  contents: write

concurrency:
  group: issue-57-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-57-mermaid-converter
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use repository npm version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - name: Refresh lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          cp package-lock.json /tmp/package-lock.json
      - name: Commit lockfile
        shell: bash
        run: |
          git fetch origin feature/issue-57-mermaid-converter
          git reset --hard origin/feature/issue-57-mermaid-converter
          cp /tmp/package-lock.json package-lock.json
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock Mermaid dependency"
          git push origin HEAD:feature/issue-57-mermaid-converter
