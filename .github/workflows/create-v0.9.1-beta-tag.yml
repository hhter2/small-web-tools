name: Create v0.9.1-beta tag

on:
  push:
    branches:
      - fix/mermaid-review-findings

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create lightweight tag on main merge commit
        shell: bash
        env:
          TAG_NAME: v0.9.1-beta
          TARGET_SHA: 7d85716067312ce586fca21a6e46ac2832343687
        run: |
          set -euo pipefail
          git fetch origin main --tags
          actual_main_sha="$(git rev-parse origin/main)"
          test "$actual_main_sha" = "$TARGET_SHA"

          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG_NAME")" = "$TARGET_SHA"
            exit 0
          fi

          git tag "$TAG_NAME" "$TARGET_SHA"
          git push origin "refs/tags/$TAG_NAME"
