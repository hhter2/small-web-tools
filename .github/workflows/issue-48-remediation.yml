name: Issue 48 remediation

on:
  push:
    branches:
      - agent/typecheck-scope-strict-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typecheck-scope-strict-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply migration
        shell: python
        run: |
          from pathlib import Path
          import json

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          scripts = pkg['scripts']
          scripts['typecheck:baseline'] = 'tsc --project jsconfig.json --noEmit'
          scripts['typecheck:domain'] = 'tsc --project jsconfig.domain.json --noEmit'
          scripts['typecheck:ui'] = 'tsc --project jsconfig.ui.json --noEmit'
          scripts.pop('typecheck:strict', None)
          scripts['typecheck'] = 'npm run typecheck:baseline && npm run typecheck:domain && npm run typecheck:ui'
          scripts['verify'] = scripts['verify'].replace('npm run typecheck && npm run typecheck:strict', 'npm run typecheck')
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          strict = json.loads(Path('jsconfig.strict.json').read_text())
          Path('jsconfig.strict.json').unlink()
          Path('jsconfig.domain.json').write_text(json.dumps(strict, indent=2) + '\n')

          ui = {
            'compilerOptions': {
              'target': 'ESNext', 'module': 'ESNext', 'moduleResolution': 'bundler',
              'jsx': 'react-jsx', 'strict': True, 'noImplicitAny': False,
              'strictNullChecks': True, 'checkJs': True, 'allowJs': True,
              'noEmit': True, 'resolveJsonModule': True, 'skipLibCheck': True,
              'lib': ['ESNext', 'DOM', 'DOM.Iterable'], 'types': ['vite/client']
            },
            'include': ['src/components/LanguageSwitcher.jsx', 'src/i18n/**/*.js'],
            'exclude': ['node_modules', 'dist', 'src/tests']
          }
          Path('jsconfig.ui.json').write_text(json.dumps(ui, indent=2) + '\n')

          additions = {
            'CONTRIBUTING.md': ("`npm run verify` runs Git-tag version resolution, lint-warning budget, normal and\nstrict checkJs, coverage, build/bundle, headers, network inventory, Cloudflare\nconfiguration, and documentation-consistency gates. CI runs it on Node 22 and\nNode 24.",
            "`npm run verify` runs Git-tag version resolution, lint-warning budget, the\nbaseline, domain, and UI checkJs projects, coverage, build/bundle, headers, network\ninventory, Cloudflare configuration, and documentation-consistency gates. CI runs\nit on Node 22 and Node 24. `npm run typecheck:baseline` checks the broad JavaScript\ngraph without strict mode, `npm run typecheck:domain` preserves the existing narrow\ndomain/shared-helper boundary, and `npm run typecheck:ui` enables `strictNullChecks`\nfor the explicitly listed shared UI migration boundary. Expand that boundary only\nwith fixes in the same change; keep exclusions minimal and documented in\n`jsconfig.ui.json`.") ,
            'CONTRIBUTING.zh-TW.md': ("npm run verify 會執行 Git 標籤版本解析、Lint 警告預算、一般與嚴格 checkJs、\n覆蓋率、建置／套件大小、標頭、網路清單、Cloudflare 設定與文件一致性檢查。\nCI 會在 Node 22 與 Node 24 上執行。",
            "npm run verify 會執行 Git 標籤版本解析、Lint 警告預算、baseline、domain 與 UI\n三個 checkJs 專案、覆蓋率、建置／套件大小、標頭、網路清單、Cloudflare 設定與\n文件一致性檢查。CI 會在 Node 22 與 Node 24 上執行。`npm run typecheck:baseline`\n檢查未啟用 strict mode 的廣泛 JavaScript 圖；`npm run typecheck:domain` 保留既有的\n領域／共用 helper 邊界；`npm run typecheck:ui` 則對明確列出的共用 UI 遷移邊界\n啟用 `strictNullChecks`。只有在同一變更中修正錯誤時才擴大該邊界，並讓\n`jsconfig.ui.json` 的排除項目維持最少且有文件說明。")
          }
          for name, (old, new) in additions.items():
            path = Path(name); text = path.read_text()
            if old not in text: raise SystemExit(f'missing contributing anchor: {name}')
            path.write_text(text.replace(old, new))

          for name, heading, body in [
            ('ARCHITECTURE.md', '## Application architecture', "## Type-checking boundaries\n\nThe JavaScript migration is split into explicit TypeScript checkJs projects.\n`jsconfig.json` is the broad non-strict baseline. `jsconfig.domain.json` is the\nlegacy narrow domain/shared-helper boundary and intentionally retains its current\nnull/implicit-any settings. `jsconfig.ui.json` is the incremental shared-UI boundary:\nit enables `strictNullChecks` and initially covers `LanguageSwitcher.jsx` plus its\ni18n dependency. `npm run typecheck` runs all three projects, so CI cannot silently\nskip a migration boundary. New exclusions must be minimal and recorded in the\nconfiguration; expanding the UI boundary requires fixing all newly exposed errors.\n\n"),
            ('ARCHITECTURE.zh-TW.md', '## 應用程式架構', "## 型別檢查邊界\n\nJavaScript 遷移拆分為明確的 TypeScript checkJs 專案。`jsconfig.json` 是廣泛的\n非 strict baseline；`jsconfig.domain.json` 是既有的狹窄領域／共用 helper 邊界，\n目前刻意保留原有的 null 與 implicit-any 設定；`jsconfig.ui.json` 是漸進式共用 UI\n邊界，啟用 `strictNullChecks`，初始涵蓋 `LanguageSwitcher.jsx` 與其 i18n 相依項。\n`npm run typecheck` 會執行三個專案，因此 CI 不會默默略過任何遷移邊界。新增排除\n必須維持最少並記錄於設定檔；擴大 UI 邊界時必須修正所有新揭露的錯誤。\n\n")]:
            path=Path(name); text=path.read_text()
            if heading not in text: raise SystemExit(f'missing architecture anchor: {name}')
            text=text.replace(heading, body+heading, 1)
            text=text.replace('normal and strict checkJs projects', 'baseline, domain, and null-strict UI checkJs projects')
            text=text.replace('一般與嚴格 checkJs 專案', 'baseline、domain 與 null-strict UI checkJs 專案')
            text=text.replace('├── jsconfig.json             TypeScript checkJs configuration for JavaScript', '├── jsconfig.json             Broad non-strict TypeScript checkJs baseline\n├── jsconfig.domain.json      Narrow domain/shared-helper checkJs boundary\n├── jsconfig.ui.json          Incremental strictNullChecks UI boundary')
            text=text.replace('├── jsconfig.json             JavaScript 的 TypeScript checkJs 設定', '├── jsconfig.json             廣泛的非 strict TypeScript checkJs baseline\n├── jsconfig.domain.json      狹窄的領域／共用 helper checkJs 邊界\n├── jsconfig.ui.json          漸進式 strictNullChecks UI 邊界')
            path.write_text(text)
      - name: Install and verify
        run: |
          npm install --global npm@10.9.2
          npm ci
          npm run typecheck
          npm run docs:check
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json jsconfig.json jsconfig.domain.json jsconfig.ui.json CONTRIBUTING.md CONTRIBUTING.zh-TW.md ARCHITECTURE.md ARCHITECTURE.zh-TW.md
          git add -u jsconfig.strict.json
          git commit -m "chore: clarify typecheck scopes and add strict UI boundary"
          git push
