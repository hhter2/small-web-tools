name: Issue 57 documentation update

on:
  push:
    branches:
      - feature/issue-57-mermaid-converter
    paths:
      - .github/workflows/issue-57-docs.yml

permissions:
  contents: write

concurrency:
  group: issue-57-docs
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-57-mermaid-converter
      - name: Add Mermaid route inventory entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          labels = {
              'ARCHITECTURE.md': 'Mermaid Converter',
              'ARCHITECTURE.zh-TW.md': 'Mermaid 轉換器',
          }

          for filename, label in labels.items():
              path = Path(filename)
              lines = path.read_text().splitlines()
              if any('`tool-mermaid`' in line for line in lines):
                  continue

              for index, line in enumerate(lines):
                  if line.startswith('| `tool-markdown` |'):
                      columns = [column.strip() for column in line.split('|')]
                      category = columns[4]
                      lines.insert(
                          index + 1,
                          f'| `tool-mermaid` | {label} | `MermaidConverter.jsx` | {category} |',
                      )
                      path.write_text('\n'.join(lines) + '\n')
                      break
              else:
                  raise SystemExit(f'Expected tool-markdown route row not found in {filename}')
          PY
      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.md ARCHITECTURE.zh-TW.md
          git rm .github/workflows/issue-57-docs.yml
          git commit -m "docs: add Mermaid route inventory"
          git push origin HEAD:feature/issue-57-mermaid-converter
